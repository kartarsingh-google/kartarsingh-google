<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Dot Painter</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      min-height: 100vh;
      margin: 0;
      padding: 30px 0 0 0;
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      cursor: crosshair;
    }
    .header-container {
      max-width: 600px;
      margin: 0 auto 30px auto;
      padding: 20px 25px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
      z-index: 10;
      cursor: default;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 10px 0;
      color: #212529;
    }
    p {
      font-size: 14px;
      color: #6c757d;
      margin: 0 0 20px 0;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      background-color: #f1f3f5;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .stats span {
      font-weight: bold;
      color: #212529;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #dc3545;
      color: white;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    button:hover {
      background-color: #c82333;
    }
    button:active {
      transform: scale(0.98);
    }
    .dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #e63946;
      border: 1px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.4);
      z-index: 5;
    }
  </style>
</head>
<body>

  <div class="header-container" id="control-panel">
    <h1>Click Dot Painter</h1>
    <p>Click anywhere on the page to paint a small dot where the click happened.</p>
    
    <div class="stats">
      <div>Dots Painted: <span id="dot-count">0</span></div>
      <div>Last Click: <span id="last-coords">None</span></div>
    </div>

    <div class="controls">
      <button id="clear-btn" onclick="clearDots(event)">Clear Dots</button>
    </div>
  </div>

  <script>
    let dotCount = 0;

    // Prevent clicks inside the control panel from painting dots
    document.getElementById('control-panel').addEventListener('click', (event) => {
      event.stopPropagation();
    });

    document.addEventListener('click', (event) => {
      paintDot(event.pageX, event.pageY);
    });

    function paintDot(x, y) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.left = `${x}px`;
      dot.style.top = `${y}px`;

      document.body.appendChild(dot);

      dotCount++;
      updateStats(x, y);
    }

    function clearDots(event) {
      if (event) {
        event.stopPropagation();
      }
      const dots = document.querySelectorAll('.dot');
      dots.forEach(dot => dot.remove());
      dotCount = 0;
      document.getElementById('dot-count').textContent = '0';
      document.getElementById('last-coords').textContent = 'None';
    }

    function updateStats(x, y) {
      document.getElementById('dot-count').textContent = dotCount;
      document.getElementById('last-coords').textContent = `(${Math.round(x)}, ${Math.round(y)})`;
    }
  </script>

</body>
</html>
