<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Main-Thread Scroll vs. Composited Scroll Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 20px;
      background: #e2e8f0;
      color: #0f172a;
    }
    body.test-mode {
      margin: 0;
      padding: 0;
    }
    .hud {
      position: sticky;
      top: 0;
      background: #1e293b;
      color: #f8fafc;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.6;
    }
    .containers {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }
    .box {
      flex: 1;
      min-width: 300px;
    }
    #scroller {
      width: 300px;
      height: 300px;
      overflow: auto;
      border: 3px solid #dc2626;
      box-sizing: border-box;
    }
    #compositedScroller {
      width: 300px;
      height: 300px;
      overflow: auto;
      border: 3px solid #16a34a;
      background: #ffffff;
      will-change: transform;
      box-sizing: border-box;
    }
    .space {
      width: 300px;
      height: 5000px;
      box-sizing: border-box;
    }
    .row {
      height: 50px;
      line-height: 50px;
      padding-left: 12px;
      font-size: 18px;
      font-weight: bold;
      box-sizing: border-box;
      border-bottom: 2px solid #334155;
    }
    .row-even {
      background: rgba(254, 202, 202, 0.85);
      color: #7f1d1d;
    }
    .row-odd {
      background: rgba(191, 219, 254, 0.85);
      color: #1e3a8a;
    }
  </style>
</head>
<body>
  <div class="hud" id="hud">
    Touch and drag inside either scroller to measure frequencies.<br/>
    Tip: Open DevTools -> More tools -> <b>Layers</b> (3D view) and <b>Rendering</b> -> check <b>"Paint flashing"</b> &amp; <b>"Layer borders"</b>.
  </div>

  <div class="containers">
    <div class="box" id="mainBox">
      <h3 id="mainTitle">1. Main-Thread-Painted Scroller (<code>#scroller</code>)</h3>
      <div id="scroller">
        <div class="space" id="mainSpace"></div>
      </div>
    </div>

    <div class="box" id="compBox">
      <h3 id="compTitle">2. Composited Scroller (<code>#compositedScroller</code>)</h3>
      <div id="compositedScroller">
        <div class="space" id="compSpace"></div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode');
    if (mode === 'main') {
      document.body.classList.add('test-mode');
      document.getElementById('hud').style.display = 'none';
      document.getElementById('compBox').style.display = 'none';
      document.getElementById('mainTitle').style.display = 'none';
    } else if (mode === 'composited') {
      document.body.classList.add('test-mode');
      document.getElementById('hud').style.display = 'none';
      document.getElementById('mainBox').style.display = 'none';
      document.getElementById('compTitle').style.display = 'none';
    } else {
      document.getElementById('scroller').style.backgroundAttachment = 'fixed';
    }

    for (const id of ['mainSpace', 'compSpace']) {
      const container = document.getElementById(id);
      let html = '';
      for (let i = 0; i < 100; i++) {
        const cls = (i % 2 === 0) ? 'row row-even' : 'row row-odd';
        html += `<div class="${cls}">ROW #${i} (y=${i * 50}px)</div>`;
      }
      container.innerHTML = html;
    }

    const hud = document.getElementById('hud');
    window.touchMoveCount = 0;
    window.scrollCount = 0;
    window.rafCount = 0;
    window.scrollingActive = false;
    window.activeTarget = '';

    function tick() {
      if (window.scrollingActive) {
        window.rafCount++;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function updateHud() {
      const elapsedMs = (window.endTime || performance.now()) - (window.startTime || performance.now());
      const sec = Math.max(elapsedMs / 1000, 0.001);
      hud.innerHTML =
        `<b>Active Target:</b> ${window.activeTarget} | <b>Duration:</b> ${elapsedMs.toFixed(1)} ms<br/>` +
        `<b>touchmove:</b> ${window.touchMoveCount} (${(window.touchMoveCount / sec).toFixed(1)} Hz) | ` +
        `<b>scroll events (Main Thread Commits):</b> ${window.scrollCount} (${(window.scrollCount / sec).toFixed(1)} Hz) | ` +
        `<b>rAF:</b> ${window.rafCount} (${(window.rafCount / sec).toFixed(1)} Hz)`;
    }

    function attachListeners(el, label) {
      el.addEventListener('touchstart', () => {
        window.scrollingActive = true;
        window.activeTarget = label;
        window.touchMoveCount = 0;
        window.scrollCount = 0;
        window.rafCount = 0;
        window.startTime = performance.now();
        window.endTime = 0;
        updateHud();
      }, {passive: true});

      el.addEventListener('touchmove', () => {
        if (window.scrollingActive) {
          window.touchMoveCount++;
          updateHud();
        }
      }, {passive: true});

      el.addEventListener('scroll', () => {
        if (window.scrollingActive) {
          window.scrollCount++;
          updateHud();
        }
      }, {passive: true});

      el.addEventListener('touchend', () => {
        window.endTime = performance.now();
        window.scrollingActive = false;
        updateHud();
      }, {passive: true});
    }

    attachListeners(document.getElementById('scroller'), '#scroller (Main-Thread Painted)');
    attachListeners(document.getElementById('compositedScroller'), '#compositedScroller (Composited Layer)');
    document.title = 'ready';
  </script>
</body>
</html>
